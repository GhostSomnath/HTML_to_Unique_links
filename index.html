<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Link & Block Extractor</title>
</head>
<body class="bg-slate-900 text-slate-200 p-4 md:p-10 min-h-screen font-sans">
    <div class="max-w-7xl mx-auto space-y-6">
        <header>
            <h1 class="text-3xl font-bold text-white tracking-tight">Snippet <span class="text-blue-500">Scraper</span></h1>
            <p class="text-slate-400 text-sm mt-1">Extract URLs, UTMs, and Jinja <code>{{block}}</code> snippets instantly.</p>
        </header>

        <textarea id="inputCode" class="w-full h-64 p-4 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm shadow-inner placeholder-slate-500" placeholder="Paste your HTML or Jinja code here..."></textarea>
        
        <button onclick="extract()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-10 rounded-lg shadow-lg transition-all active:scale-95">Extract All Data</button>

        <div id="results" class="grid lg:grid-cols-3 gap-6 hidden">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <h2 class="text-blue-400 font-bold uppercase text-xs tracking-widest mb-4 flex justify-between">
                    <span>Anchor Tags</span>
                    <span id="aCount" class="text-slate-500">0</span>
                </h2>
                <ul id="aLinks" class="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar"></ul>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <h2 class="text-emerald-400 font-bold uppercase text-xs tracking-widest mb-4 flex justify-between">
                    <span>All href Attributes</span>
                    <span id="allCount" class="text-slate-500">0</span>
                </h2>
                <ul id="allHrefs" class="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar"></ul>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <h2 class="text-purple-400 font-bold uppercase text-xs tracking-widest mb-4 flex justify-between">
                    <span>Jinja Blocks</span>
                    <span id="blockCount" class="text-slate-500">0</span>
                </h2>
                <ul id="blockSnippets" class="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar"></ul>
            </div>
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>

    <script>
        async function copyText(text, btn) {
            try {
                await navigator.clipboard.writeText(text);
                const originalInner = btn.innerHTML;
                btn.innerHTML = `<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                setTimeout(() => { btn.innerHTML = originalInner; }, 1500);
            } catch (err) { console.error('Copy failed', err); }
        }

        function extract() {
            const code = document.getElementById('inputCode').value;
            const resultsDiv = document.getElementById('results');
            
            const aRegex = /<a\s+[^>]*href=["']([^"']*)["']/gi;
            const allRegex = /href=["']([^"']*)["']/gi;
            const blockRegex = /{{block\(["'][^"']*["']\)}}/gi;

            const getUniqueMatches = (regex, isCaptureGroup = true) => {
                const matches = Array.from(code.matchAll(regex), m => (isCaptureGroup ? m[1] : m[0]).trim());
                return [...new Set(matches.filter(x => x.length > 0))];
            };

            const render = (list, containerId, countId) => {
                const container = document.getElementById(containerId);
                document.getElementById(countId).innerText = `${list.length} unique`;
                
                container.innerHTML = list.length ? list.map(item => `
                    <li class="flex items-center justify-between gap-3 text-[10px] bg-slate-900/50 p-2 rounded border border-slate-700/50 hover:border-blue-500/30">
                        <span class="truncate text-slate-300 font-mono" title="${item}">${item}</span>
                        <button onclick="copyText('${item.replace(/'/g, "\\'")}', this)" class="shrink-0 p-1 hover:bg-slate-700 rounded text-slate-400 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        </button>
                    </li>
                `).join('') : '<li class="text-slate-500 italic text-xs text-center py-4">None found</li>';
            };

            render(getUniqueMatches(aRegex), 'aLinks', 'aCount');
            render(getUniqueMatches(allRegex), 'allHrefs', 'allCount');
            render(getUniqueMatches(blockRegex, false), 'blockSnippets', 'blockCount');

            resultsDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
