<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Link Scraper Pro</title>
</head>
<body class="bg-slate-900 text-slate-200 p-4 md:p-10 min-h-screen font-sans">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Link <span class="text-blue-500">Extractor</span></h1>
                <p class="text-slate-400 text-sm mt-1">Supports standard URLs, UTM parameters, and Jinja templates like <code class="text-blue-300">{{ item.url }}</code>.</p>
            </div>
        </header>

        <textarea id="inputCode" class="w-full h-64 p-4 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm shadow-inner placeholder-slate-500" placeholder="Paste HTML, CSS, JS or Jinja templates here..."></textarea>
        
        <button onclick="extract()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-10 rounded-lg shadow-lg transition-all active:scale-95 flex items-center gap-2">
            <span>Extract Unique Links</span>
        </button>

        <div id="results" class="grid md:grid-cols-2 gap-8 hidden">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <h2 class="text-blue-400 font-bold uppercase text-xs tracking-widest mb-4 flex justify-between">
                    <span>Anchor Tags (&lt;a href&gt;)</span>
                    <span id="aCount" class="text-slate-500">0 found</span>
                </h2>
                <ul id="aLinks" class="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar"></ul>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <h2 class="text-emerald-400 font-bold uppercase text-xs tracking-widest mb-4 flex justify-between">
                    <span>All href Attributes</span>
                    <span id="allCount" class="text-slate-500">0 found</span>
                </h2>
                <ul id="allHrefs" class="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar"></ul>
            </div>
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .copy-success { color: #10b981 !important; }
    </style>

    <script>
        async function copyText(text, btn) {
            try {
                await navigator.clipboard.writeText(text);
                const originalInner = btn.innerHTML;
                btn.innerHTML = `<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                setTimeout(() => { btn.innerHTML = originalInner; }, 1500);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        }

        function extract() {
            const code = document.getElementById('inputCode').value;
            const resultsDiv = document.getElementById('results');
            
            // Patterns to capture standard URLs, UTMs, and Jinja/Liquid tags within href quotes
            const aRegex = /<a\s+[^>]*href=["']([^"']*)["']/gi;
            const allRegex = /href=["']([^"']*)["']/gi;

            const getUniqueMatches = (regex) => {
                const matches = Array.from(code.matchAll(regex), m => m[1].trim()).filter(link => link.length > 0);
                return [...new Set(matches)]; // Ensure uniqueness
            };

            const render = (list, containerId, countId) => {
                const container = document.getElementById(containerId);
                document.getElementById(countId).innerText = `${list.length} unique found`;
                
                if (list.length === 0) {
                    container.innerHTML = '<li class="text-slate-500 italic text-sm text-center py-4">No links detected</li>';
                    return;
                }

                container.innerHTML = list.map(link => `
                    <li class="group flex items-center justify-between gap-3 text-xs bg-slate-900/50 p-3 rounded border border-slate-700/50 hover:border-blue-500/50 transition-colors">
                        <span class="truncate text-slate-300" title="${link}">${link}</span>
                        <button onclick="copyText('${link.replace(/'/g, "\\'")}', this)" class="shrink-0 p-1.5 hover:bg-slate-700 rounded transition-colors text-slate-400 hover:text-white" title="Copy Link">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        </button>
                    </li>
                `).join('');
            };

            const aLinks = getUniqueMatches(aRegex);
            const allHrefs = getUniqueMatches(allRegex);

            render(aLinks, 'aLinks', 'aCount');
            render(allHrefs, 'allHrefs', 'allCount');

            resultsDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
